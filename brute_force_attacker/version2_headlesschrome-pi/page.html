<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble CAPTCHA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #e6f0ff, #f5faff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .captcha-container {
            width: 600px;
            height: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .hud {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e1e8f0;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hud-title {
            font-size: 18px;
            font-weight: bold;
            color: #283593;
            margin-bottom: 4px;
        }

        .hud-instruction {
            font-size: 14px;
            color: #546e7a;
        }

        .game-area {
            height: 280px;
            position: relative;
            background: white;
            border: 1px solid #e1e8f0;
            margin: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
            transition: transform 0.2s, opacity 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .bubble:hover {
            transform: scale(1.05);
        }

        .bubble.burst {
            transform: scale(0);
            opacity: 0;
        }

        .time-bar {
            height: 6px;
            background: #e3f2fd;
            margin: 0 10px;
            border-radius: 3px;
            overflow: hidden;
        }

        .time-fill {
            height: 100%;
            background: #2196f3;
            border-radius: 3px;
            transition: width 1s linear;
        }

        .result-banner {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .success {
            color: #4caf50;
        }

        .failure {
            color: #f44336;
        }
    </style>
</head>

<body>
    <div class="captcha-container">
        <div class="hud">
            <div class="hud-title">Bubble Human Verification</div>
            <div class="hud-instruction" id="instruction">Click bubbles in order of size</div>
        </div>

        <div class="time-bar">
            <div class="time-fill" id="timeFill"></div>
        </div>

        <div class="game-area" id="gameArea">
            <!-- Bubbles will be generated here -->
        </div>

        <div class="result-banner" id="resultBanner" style="display: none;"></div>
    </div>

    <script>
        class BubbleCaptcha {
            constructor() {
                this.gameArea = document.getElementById('gameArea');
                this.instruction = document.getElementById('instruction');
                this.timeFill = document.getElementById('timeFill');
                this.resultBanner = document.getElementById('resultBanner');

                this.bubbles = [];
                this.clickedSizes = [];
                this.state = 'RUNNING'; // RUNNING, PASSED, FAILED
                this.startTime = Date.now();
                this.maxDuration = 20000; // 20 seconds
                this.instructionObj = this.generateInstruction();

                this.init();
                this.animate();
            }

            generateInstruction() {
                const count = Math.random() > 0.5 ? 2 : 3;
                const direction = Math.random() > 0.5 ? 'ascending' : 'descending';
                const text = `Burst ${count} bubbles in ${direction} order of size.`;

                return { text, count, direction };
            }

            init() {
                // Set instruction
                this.instruction.textContent = this.instructionObj.text;

                // Create bubbles
                const colors = ['#4CAF50', '#2196F3', '#FF9800', '#E91E63', '#9C27B0'];

                for (let i = 0; i < 5; i++) {
                    const radius = Math.floor(Math.random() * 25) + 25; // 25-50px
                    const color = colors[Math.floor(Math.random() * colors.length)];

                    const bubble = this.createBubble(radius, color, i + 1);
                    this.bubbles.push(bubble);
                    this.gameArea.appendChild(bubble.element);
                }
            }

            createBubble(radius, color, number) {
                const element = document.createElement('div');
                element.className = 'bubble';
                element.style.width = `${radius * 2}px`;
                element.style.height = `${radius * 2}px`;
                element.style.background = color;
                element.textContent = number;

                // Random position within game area
                const maxX = this.gameArea.offsetWidth - radius * 2;
                const maxY = this.gameArea.offsetHeight - radius * 2;
                const x = Math.random() * maxX;
                const y = Math.random() * maxY;

                element.style.left = `${x}px`;
                element.style.top = `${y}px`;

                // Random velocity
                const speed = Math.random() * 2 + 1;
                const angle = Math.random() * Math.PI * 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                const bubble = {
                    element,
                    radius,
                    x: x + radius,
                    y: y + radius,
                    vx,
                    vy,
                    alive: true,
                    number
                };

                element.addEventListener('click', () => this.handleBubbleClick(bubble));

                return bubble;
            }

            handleBubbleClick(bubble) {
                if (!bubble.alive || this.state !== 'RUNNING') return;

                const size = bubble.radius;
                const prevSize = this.clickedSizes[this.clickedSizes.length - 1];

                // Check order
                if (prevSize !== undefined) {
                    if (this.instructionObj.direction === 'ascending' && size <= prevSize) {
                        this.fail();
                        return;
                    }
                    if (this.instructionObj.direction === 'descending' && size >= prevSize) {
                        this.fail();
                        return;
                    }
                }

                // Burst bubble
                bubble.alive = false;
                bubble.element.classList.add('burst');
                this.clickedSizes.push(size);

                // Check if completed
                if (this.clickedSizes.length >= this.instructionObj.count) {
                    this.pass();
                }
            }

            pass() {
                this.state = 'PASSED';
                this.showResult('CAPTCHA PASSED - Human verified!', 'success');
                // For automation detection
                document.body.setAttribute('data-captcha-result', 'success');
            }

            fail() {
                this.state = 'FAILED';
                this.showResult('CAPTCHA FAILED - Please try again', 'failure');
                document.body.setAttribute('data-captcha-result', 'failed');
            }

            showResult(message, type) {
                this.resultBanner.textContent = message;
                this.resultBanner.className = `result-banner ${type}`;
                this.resultBanner.style.display = 'flex';
            }

            animate() {
                if (this.state !== 'RUNNING') return;

                const currentTime = Date.now();
                const elapsed = currentTime - this.startTime;
                const timeLeft = Math.max(0, this.maxDuration - elapsed);

                // Update time bar
                const percentage = (timeLeft / this.maxDuration) * 100;
                this.timeFill.style.width = `${percentage}%`;

                // Move bubbles
                this.bubbles.forEach(bubble => {
                    if (!bubble.alive) return;

                    bubble.x += bubble.vx;
                    bubble.y += bubble.vy;

                    // Bounce off walls
                    if (bubble.x - bubble.radius <= 0 || bubble.x + bubble.radius >= this.gameArea.offsetWidth) {
                        bubble.vx *= -1;
                    }
                    if (bubble.y - bubble.radius <= 0 || bubble.y + bubble.radius >= this.gameArea.offsetHeight) {
                        bubble.vy *= -1;
                    }

                    // Keep within bounds
                    bubble.x = Math.max(bubble.radius, Math.min(this.gameArea.offsetWidth - bubble.radius, bubble.x));
                    bubble.y = Math.max(bubble.radius, Math.min(this.gameArea.offsetHeight - bubble.radius, bubble.y));

                    bubble.element.style.left = `${bubble.x - bubble.radius}px`;
                    bubble.element.style.top = `${bubble.y - bubble.radius}px`;
                });

                // Check timeout
                if (timeLeft <= 0 && this.clickedSizes.length < this.instructionObj.count) {
                    this.fail();
                }

                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new BubbleCaptcha();
        });
    </script>
</body>

</html>
